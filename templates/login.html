{% extends "base.html" %}
{% block link %}<link rel="stylesheet" href="{{url_for('static', filename='sign_up.css')}}">{% endblock %}
{%block title %} Login {%endblock%}

{%block content %} 
<div class="form-container">
    <h3>Login</h3>
    <form action="/login" method="post">
        <label for="name">Enter Username: </label><br>
        <input type="text" name="username" id="name" placeholder="Enter Username" required><br><br>
        <label for="password">Enter Password:</label><br>
        <input type="password" name="password" id="password" placeholder="Enter Password" required><br>
        <button type="submit" class="btn">Login</button>
    </form>
    <p>Already have an Account? <span><a href="/sign-up">Sign-Up</a></span></p>
</div>

{%endblock%}
